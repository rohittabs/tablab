<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>TabLab: write, play and practice guitar and ukulele tabs</title>
  <defs>
    <linearGradient id="sp-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#17C3D6"/>
    </linearGradient>
    <linearGradient id="sp-liquid" x1="8" y1="34" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#17C3D6"/>
    </linearGradient>
    <linearGradient id="sp-word" x1="0" y1="0" x2="70" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#17C3D6"/>
    </linearGradient>
    <clipPath id="sp-inside">
      <path d="M27 9.5V25.5L12.4 50.2C10.6 53.3 12.6 56.3 16.2 56.3H47.8C51.4 56.3 53.4 53.3 51.6 50.2L37 25.5V9.5Z"/>
    </clipPath>
    <radialGradient id="sp-glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#7C5CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-glow2" cx="0.05" cy="1" r="0.6">
      <stop offset="0" stop-color="#17C3D6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#17C3D6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="#F4F4F9"/>
  <rect width="1280" height="640" fill="url(#sp-glow)"/>
  <rect width="1280" height="640" fill="url(#sp-glow2)"/>

  <!-- Logo -->
  <g transform="translate(96 88) scale(2.1)">
    <g clip-path="url(#sp-inside)">
      <path d="M0 35.5C6 33 11 33 16.5 35.5S27 38 32.5 35.5S43 33 48.5 35.5S59 38 64 35.5V64H0Z" fill="url(#sp-liquid)"/>
      <g stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.5" stroke-linecap="round">
        <line x1="0" y1="41.2" x2="64" y2="41.2"/><line x1="0" y1="45.6" x2="64" y2="45.6"/>
        <line x1="0" y1="50" x2="64" y2="50"/><line x1="0" y1="54.4" x2="64" y2="54.4"/>
      </g>
      <g fill="#FFFFFF"><circle cx="25.2" cy="50" r="2.5"/><circle cx="31.8" cy="45.6" r="2.5"/><circle cx="38.4" cy="41.2" r="2.5"/></g>
    </g>
    <circle cx="30.6" cy="29" r="2.1" fill="#17C3D6"/><circle cx="34.4" cy="20.6" r="1.5" fill="#7C5CFF"/><circle cx="30.9" cy="14.2" r="1.1" fill="#17C3D6"/>
    <path d="M27 9.5V25.5L12.4 50.2C10.6 53.3 12.6 56.3 16.2 56.3H47.8C51.4 56.3 53.4 53.3 51.6 50.2L37 25.5V9.5" fill="none" stroke="#1C1D29" stroke-width="3.4" stroke-linejoin="round"/>
    <rect x="23" y="5.6" width="18" height="4.6" rx="2.3" fill="#1C1D29"/>
    <g transform="translate(72 17)"><g fill="none" stroke="#1C1D29" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0H20M10 0V30"/><circle cx="33.5" cy="20.5" r="9.5"/><path d="M43 11V30"/><path d="M53 0V30"/><circle cx="62.5" cy="20.5" r="9.5"/>
    </g></g>
    <g transform="translate(155 17)"><g fill="none" stroke="url(#sp-word)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 0V30H12"/><circle cx="27.5" cy="20.5" r="9.5"/><path d="M37 11V30"/><path d="M47 0V30"/><circle cx="56.5" cy="20.5" r="9.5"/>
    </g></g>
  </g>

  <!-- Tagline -->
  <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1C1D29">
    <text x="100" y="300" font-size="46" font-weight="700">Write, play and practice</text>
    <text x="100" y="356" font-size="46" font-weight="700">guitar and ukulele tabs.</text>
    <text x="100" y="410" font-size="25" fill="#646A80">Free, in your browser. Built for students.</text>
  </g>

  <!-- Feature chips -->
  <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(100 456)">
      <rect width="226" height="46" rx="23" fill="#FFFFFF" stroke="#E0E0EC"/>
      <text x="113" y="30" text-anchor="middle" fill="#6447F5">Keyboard shortcuts</text>
    </g>
    <g transform="translate(340 456)">
      <rect width="236" height="46" rx="23" fill="#FFFFFF" stroke="#E0E0EC"/>
      <text x="118" y="30" text-anchor="middle" fill="#6447F5">Backing track sync</text>
    </g>
    <g transform="translate(100 516)">
      <rect width="262" height="46" rx="23" fill="#FFFFFF" stroke="#E0E0EC"/>
      <text x="131" y="30" text-anchor="middle" fill="#0F9FB3">Tempo and count-in</text>
    </g>
    <g transform="translate(376 516)">
      <rect width="200" height="46" rx="23" fill="#FFFFFF" stroke="#E0E0EC"/>
      <text x="100" y="30" text-anchor="middle" fill="#0F9FB3">Light and dark</text>
    </g>
  </g>

  <!-- Tab card -->
  <g transform="translate(676 118)">
    <rect width="512" height="404" rx="26" fill="#FFFFFF" stroke="#E0E0EC"/>
    <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
      <text x="36" y="58" font-size="24" font-weight="700" fill="#1C1D29">First Steps</text>
      <text x="36" y="86" font-size="16" fill="#646A80">Guitar · Standard · 88 BPM</text>
      <text x="64" y="138" font-size="17" font-weight="700" fill="#1C1D29">C</text>
      <text x="268" y="138" font-size="17" font-weight="700" fill="#1C1D29">Am</text>
    </g>
    <!-- six strings -->
    <g stroke="#B7BAC9" stroke-width="1.6">
      <line x1="36" y1="166" x2="476" y2="166"/><line x1="36" y1="192" x2="476" y2="192"/>
      <line x1="36" y1="218" x2="476" y2="218"/><line x1="36" y1="244" x2="476" y2="244"/>
      <line x1="36" y1="270" x2="476" y2="270"/><line x1="36" y1="296" x2="476" y2="296"/>
    </g>
    <g stroke="#6A6E86" stroke-width="2">
      <line x1="36" y1="166" x2="36" y2="296"/><line x1="252" y1="166" x2="252" y2="296"/><line x1="476" y1="166" x2="476" y2="296"/>
    </g>
    <!-- loop band and cursor -->
    <rect x="252" y="150" width="224" height="162" fill="#FFAA00" fill-opacity="0.12"/>
    <rect x="148" y="152" width="44" height="158" rx="8" fill="#6447F5" fill-opacity="0.13"/>
    <!-- frets -->
    <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1C1D29" text-anchor="middle">
      <g><rect x="58" y="180" width="24" height="24" fill="#FFFFFF"/><text x="70" y="200">1</text></g>
      <g><rect x="106" y="180" width="24" height="24" fill="#FFFFFF"/><text x="118" y="200">3</text></g>
      <g><rect x="158" y="154" width="24" height="24" fill="#FFFFFF"/><text x="170" y="174">0</text></g>
      <g><rect x="206" y="154" width="24" height="24" fill="#FFFFFF"/><text x="218" y="174">3</text></g>
      <g><rect x="270" y="154" width="24" height="24" fill="#FFFFFF"/><text x="282" y="174">5</text></g>
      <g><rect x="346" y="154" width="24" height="24" fill="#FFFFFF"/><text x="358" y="174">3</text></g>
      <g><rect x="398" y="154" width="24" height="24" fill="#FFFFFF"/><text x="410" y="174">0</text></g>
    </g>
    <!-- hammer-on arc and slide -->
    <path d="M74 178 Q94 162 114 178" fill="none" stroke="#646A80" stroke-width="2"/>
    <path d="M300 168 L338 160" fill="none" stroke="#646A80" stroke-width="2"/>
    <!-- playhead -->
    <line x1="194" y1="142" x2="194" y2="320" stroke="#F0365A" stroke-width="3" stroke-linecap="round"/>
    <!-- rhythm stems -->
    <g stroke="#1C1D29" stroke-width="2">
      <line x1="70" y1="316" x2="70" y2="340"/><line x1="118" y1="316" x2="118" y2="340"/>
      <line x1="170" y1="316" x2="170" y2="340"/><line x1="218" y1="316" x2="218" y2="340"/>
      <line x1="282" y1="316" x2="282" y2="332"/><line x1="358" y1="316" x2="358" y2="340"/><line x1="410" y1="316" x2="410" y2="340"/>
    </g>
    <!-- player bar -->
    <g transform="translate(36 352)">
      <rect width="440" height="36" rx="12" fill="#EEEEF6"/>
      <rect x="6" y="5" width="40" height="26" rx="9" fill="url(#sp-grad)"/>
      <path d="M21 11 L33 18 L21 25 Z" fill="#FFFFFF"/>
      <g font-family="Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#646A80">
        <text x="62" y="23">1-2 count-in</text>
        <text x="180" y="23">88 BPM</text>
        <text x="262" y="23">Speed 75%</text>
      </g>
      <rect x="352" y="15" width="74" height="6" rx="3" fill="#D6D3F5"/>
      <rect x="352" y="15" width="48" height="6" rx="3" fill="#6447F5"/>
      <circle cx="400" cy="18" r="7" fill="#6447F5"/>
    </g>
  </g>
</svg>
